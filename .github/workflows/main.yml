name: Personal Website Workflow
run-name: ${{github.actor}} is starting job
on: [push]

jobs:
  install-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: "node_modules"
          key: ${{runner.os}}-node-${{hashFiles('**/package-lock.json')}}

  build:
    runs-on: ubuntu-latest
    needs: install-packages
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Restore cache node modules
        uses: actions/cache@v4
        with:
          path: "node_modules"
          key: ${{runner.os}}-node-${{hashFiles('**/package-lock.json')}}

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: install-packages
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Restore cache node modules
        uses: actions/cache@v4
        with:
          path: "node_modules"
          key: ${{runner.os}}-node-${{hashFiles('**/package-lock.json')}}

      - name: Test
        run: npm run test
